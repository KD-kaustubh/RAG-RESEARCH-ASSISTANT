services:
  api:
    build: .
    image: rag-research-assistant
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      PORT: "8000"
      FAISS_INDEX_PATH: /app/faiss_index
    ports:
      - "8000:8000"
    volumes:
      # Keeps the built index between restarts so it is not re-embedded every time.
      - faiss_index:/app/faiss_index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: .
    image: rag-research-assistant
    command: streamlit run src/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      PORT: "8501"
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  faiss_index:
